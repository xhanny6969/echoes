[package]
name = "allowance-vault"
version = "0.1.0"
edition = "2021"
description = "Protocol-enforced spending vault for AI agents on NEAR"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.5.0"

[dev-dependencies]
# near-sdk 5.x refuses to compile for native `cargo test` unless the
# unit-testing feature is enabled. Without this, the `#[cfg(test)]` module
# in src/lib.rs cannot run at all.
near-sdk = { version = "5.5.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
